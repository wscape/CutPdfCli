name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0, optional)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64)
          - os: ubuntu-latest
            os_name: Linux x86_64
            artifact_id: linux-x86_64
            binary_name: CutPdfCli-linux-x86_64
            archive_name: CutPdfCli-linux-x86_64.tar.gz

          # Windows (x86_64)
          - os: windows-latest
            os_name: Windows x86_64
            artifact_id: windows-x86_64
            binary_name: CutPdfCli-windows-x86_64.exe
            archive_name: CutPdfCli-windows-x86_64.zip

          # macOS Apple Silicon (arm64)
          - os: macos-latest
            os_name: macOS Apple Silicon (arm64)
            artifact_id: macos-arm64
            binary_name: CutPdfCli-macos-arm64
            archive_name: CutPdfCli-macos-arm64.tar.gz

          # macOS Intel (x86_64)
          - os: macos-15-intel
            os_name: macOS Intel (x86_64)
            artifact_id: macos-x86_64
            binary_name: CutPdfCli-macos-x86_64
            archive_name: CutPdfCli-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean CutPdfCli.spec

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release_assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/CutPdfCli.exe release_assets/${{ matrix.binary_name }}
            python -c "import zipfile; zipfile.ZipFile('release_assets/${{ matrix.archive_name }}', 'w', zipfile.ZIP_DEFLATED).write('dist/CutPdfCli.exe', 'CutPdfCli.exe')"
          else
            cp dist/CutPdfCli release_assets/${{ matrix.binary_name }}
            chmod +x release_assets/${{ matrix.binary_name }}
            tar -czvf release_assets/${{ matrix.archive_name }} -C dist CutPdfCli
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cutpdfcli-${{ matrix.artifact_id }}
          path: release_assets/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cutpdfcli-*
          path: dist_all
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist_all
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist_all/*
          generate_release_notes: true
